<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameHub</title>
<style>body{margin:0;font:16px system-ui;background:#12141c;color:#eee}header{display:flex;gap:8px;align-items:center;padding:8px;background:#1d2030;flex-wrap:wrap}nav{flex:1}button{background:#4a6cf7;color:#fff;border:0;border-radius:8px;padding:8px 12px;margin:2px;cursor:pointer}button:disabled{opacity:.4}input,select{padding:8px;margin:3px;border-radius:8px;border:1px solid #444;background:#222;color:#fff}main{padding:12px;max-width:900px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.card{background:#1d2030;border-radius:12px;padding:14px;text-align:center;cursor:pointer}.card b{display:block;font-size:40px}.card small{display:block;opacity:.6}.row{background:#1d2030;padding:8px;margin:4px 0;border-radius:8px}canvas{max-width:100%;background:#000;border-radius:8px;touch-action:none}#pad button{width:64px;height:64px;font-size:26px;margin:4px;user-select:none;touch-action:manipulation}#t{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;pointer-events:none}</style></head><body>
<header><button onclick="admin()">🛠 Admin</button><b>🎮 GameHub</b><nav><button onclick="nav('home')">Spellen</button><button onclick="nav('maak')">➕ Maken</button><button onclick="nav('taken')">🪙 Taken</button><button onclick="nav('premium')">⭐ Premium</button></nav><span id="user"></span></header>
<main id="main"></main><div id="t"></div><script src="games.js"></script><script src="app.js"></script></body></html>
